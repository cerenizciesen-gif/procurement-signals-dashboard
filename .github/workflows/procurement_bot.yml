name: Procurement signals

on: {workflow_dispatch: null, schedule: [{cron: "0 5 * * *"}]}

permissions:
  contents: write

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate signals
        run: python analyze_data.py

      - name: Commit and push updated signals
        run: |
          git config user.name "procurement-bot"
          git config user.email "procurement-bot@users.noreply.github.com"
          if git diff --quiet -- signals.json; then
            echo "No signal changes to commit."
          else
            git add signals.json
            git commit -m "Update procurement signals"
            git push
          fi
