name: Procurement signals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: procurement-signals-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check DeepSeek secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is missing. Workflow will continue with fallback logic."
          else
            echo "DeepSeek API key is configured."
          fi

      - name: Scan external sources
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python monitor_sources.py

      - name: Generate signals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          USE_LIVE_MACRO: "0"
        run: python analyze_data.py

      - name: Commit and push updated signals
        run: |
          git config user.name "procurement-bot"
          git config user.email "procurement-bot@users.noreply.github.com"

          git add signals.json macro_signals.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update procurement signals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
