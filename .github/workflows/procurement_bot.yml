name: Procurement signals

on: {workflow_dispatch: null, schedule: [{cron: "0 5 * * *"}]}

permissions:
  contents: write

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Scan external sources
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor_sources.py

      - name: Generate signals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_LIVE_MACRO: "0"
        run: python analyze_data.py

      - name: Commit and push updated signals
        run: |
          git config user.name "procurement-bot"
          git config user.email "procurement-bot@users.noreply.github.com"
          git add -A signals.json macro_signals.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update procurement signals"
            git push
          fi
