name: Baseline benchmark

on:
  workflow_dispatch:

concurrency:
  group: baseline-benchmark-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run baseline benchmark
        env:
          USE_LIVE_MACRO: "0"
        run: python tests/run_baseline_test.py

      - name: Commit benchmark results
        run: |
          git config user.name "procurement-bot"
          git config user.email "procurement-bot@users.noreply.github.com"
          git add tests/results/baseline_test_results.csv
          git add tests/results/baseline_metrics.json

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add baseline benchmark results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
