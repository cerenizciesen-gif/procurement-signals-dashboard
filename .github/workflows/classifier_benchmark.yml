name: Classifier benchmark

on:
  workflow_dispatch:

concurrency:
  group: classifier-benchmark-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check DeepSeek secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is missing."
            exit 1
          fi
          echo "DeepSeek API key is configured."

      - name: Run classifier benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python tests/run_classifier_test.py

      - name: Commit benchmark results
        run: |
          git config user.name "procurement-bot"
          git config user.email "procurement-bot@users.noreply.github.com"
          git add tests/results/headlines_test_results.csv
          git add tests/results/headlines_metrics.json

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add classifier benchmark results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
